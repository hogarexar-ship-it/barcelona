<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Fontanería resuelta en Eixample, Barcelona">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#F3E9D8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#w1)"/>
  <rect x="0" y="360" width="800" height="240" fill="#E7E5E2" opacity="0.6"/>
  <g stroke="#443F38" stroke-opacity="0.15" stroke-width="2">
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- pila de baño -->
  <rect x="260" y="300" width="280" height="30" rx="15" fill="#FDFBF7" stroke="#2A2620" stroke-width="5"/>
  <ellipse cx="400" cy="330" rx="150" ry="26" fill="#FDFBF7" stroke="#2A2620" stroke-width="5"/>
  <rect x="380" y="240" width="40" height="70" rx="10" fill="#C55F2C"/>
  <rect x="392" y="228" width="16" height="20" rx="4" fill="#C55F2C"/>
  <rect x="330" y="330" width="140" height="200" fill="#FDFBF7" stroke="#2A2620" stroke-width="5"/>

  <!-- badge de finalizado -->
  <circle cx="640" cy="110" r="46" fill="#C55F2C"/>
  <path d="M618 112 L634 128 L664 92" fill="none" stroke="#FDFBF7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="32" y="504" width="360" height="64" rx="16" fill="#FDFBF7" opacity="0.94"/>
  <text x="56" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1814">Reparación de fuga</text>
  <text x="56" y="556" font-family="Arial, sans-serif" font-size="16" fill="#6B655D">Eixample, Barcelona</text>
</svg>
