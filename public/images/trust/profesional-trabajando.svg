<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Profesional trabajando mientras recibe un nuevo aviso de trabajo en el móvil, ya gestionado por Hogarex">
  <defs>
    <linearGradient id="pw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#F3E9D8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pw)"/>
  <circle cx="120" cy="120" r="140" fill="#C55F2C" opacity="0.1"/>
  <circle cx="680" cy="500" r="150" fill="#5A2814" opacity="0.08"/>

  <!-- profesional -->
  <circle cx="300" cy="230" r="66" fill="#E89F72"/>
  <rect x="220" y="300" width="160" height="180" rx="24" fill="#2A2620"/>
  <rect x="248" y="300" width="104" height="70" rx="16" fill="#5A2814"/>
  <path d="M264 236 a 36 36 0 0 1 72 0" fill="none" stroke="#2A2620" stroke-width="10"/>
  <circle cx="270" cy="234" r="9" fill="#2A2620"/>
  <circle cx="330" cy="234" r="9" fill="#2A2620"/>

  <!-- herramienta en mano -->
  <g transform="translate(370,330) rotate(20)">
    <rect x="0" y="0" width="16" height="90" rx="8" fill="#443F38"/>
    <path d="M-14 0 a 22 22 0 1 1 44 0 z" fill="#443F38"/>
  </g>

  <!-- movil con notificacion -->
  <g transform="translate(500,180)">
    <rect x="0" y="0" width="150" height="260" rx="24" fill="#1B1814"/>
    <rect x="10" y="16" width="130" height="228" rx="14" fill="#FDFBF7"/>
    <rect x="24" y="40" width="102" height="70" rx="14" fill="#C55F2C"/>
    <text x="34" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FDFBF7">Nuevo trabajo</text>
    <text x="34" y="86" font-family="Arial, sans-serif" font-size="12" fill="#FDF3EE">Fontanería · Gràcia</text>
    <text x="34" y="104" font-family="Arial, sans-serif" font-size="12" fill="#FDF3EE">Presupuesto ya acordado</text>
    <rect x="24" y="126" width="102" height="14" rx="7" fill="#E7E5E2"/>
    <rect x="24" y="150" width="70" height="14" rx="7" fill="#E7E5E2"/>
  </g>

  <!-- check flotante -->
  <circle cx="470" cy="440" r="40" fill="#1B1814"/>
  <path d="M452 442 L466 456 L490 424" fill="none" stroke="#FDFBF7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="32" y="500" width="360" height="64" rx="16" fill="#FDFBF7" opacity="0.94"/>
  <text x="56" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1814">Tú trabajas.</text>
  <text x="56" y="556" font-family="Arial, sans-serif" font-size="16" fill="#6B655D">Nosotros gestionamos el resto.</text>
</svg>
