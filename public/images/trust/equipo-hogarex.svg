<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Equipo de coordinación de Hogarex atendiendo solicitudes por teléfono y WhatsApp">
  <defs>
    <linearGradient id="wt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#F3E9D8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wt)"/>
  <circle cx="120" cy="120" r="140" fill="#C55F2C" opacity="0.1"/>
  <circle cx="680" cy="500" r="150" fill="#5A2814" opacity="0.08"/>

  <!-- mesa -->
  <rect x="0" y="440" width="800" height="160" fill="#E89F72" opacity="0.3"/>

  <!-- persona con auricular -->
  <circle cx="330" cy="260" r="70" fill="#E89F72"/>
  <rect x="260" y="330" width="140" height="150" rx="30" fill="#5A2814"/>
  <path d="M270 250 a 60 60 0 0 1 120 0" fill="none" stroke="#2A2620" stroke-width="10"/>
  <circle cx="270" cy="270" r="12" fill="#2A2620"/>
  <circle cx="390" cy="270" r="12" fill="#2A2620"/>
  <path d="M390 278 q 20 10 8 40" fill="none" stroke="#2A2620" stroke-width="8" stroke-linecap="round"/>

  <!-- burbujas de chat -->
  <g>
    <rect x="470" y="150" width="220" height="70" rx="20" fill="#FDFBF7" stroke="#2A2620" stroke-width="4"/>
    <path d="M500 220 l -10 24 l 30 -14 Z" fill="#FDFBF7" stroke="#2A2620" stroke-width="4"/>
    <text x="494" y="192" font-family="Arial, sans-serif" font-size="18" fill="#1B1814">Necesito un fontanero</text>
  </g>
  <g>
    <rect x="500" y="250" width="240" height="70" rx="20" fill="#C55F2C"/>
    <path d="M520 320 l 12 24 l 24 -24 Z" fill="#C55F2C"/>
    <text x="524" y="292" font-family="Arial, sans-serif" font-size="18" fill="#FDFBF7">¡Lo coordinamos ya!</text>
  </g>

  <!-- icono casa -->
  <g transform="translate(120,420)">
    <path d="M0 40 L50 0 L100 40 Z" fill="#C55F2C"/>
    <rect x="12" y="40" width="76" height="60" fill="#FDFBF7" stroke="#2A2620" stroke-width="4"/>
    <rect x="40" y="60" width="20" height="40" fill="#7E381B"/>
  </g>

  <rect x="32" y="500" width="340" height="64" rx="16" fill="#FDFBF7" opacity="0.94"/>
  <text x="56" y="533" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1814">Coordinación Hogarex</text>
  <text x="56" y="556" font-family="Arial, sans-serif" font-size="16" fill="#6B655D">Barcelona</text>
</svg>
