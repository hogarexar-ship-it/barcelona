<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Ilustración de una vivienda en Barcelona rodeada de herramientas de fontanería, electricidad, pintura y carpintería">
  <defs>
    <linearGradient id="hh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#F3C2A4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="url(#hh)"/>
  <circle cx="640" cy="150" r="170" fill="#FFFFFF" opacity="0.22"/>
  <circle cx="120" cy="660" r="140" fill="#5A2814" opacity="0.08"/>

  <!-- casa -->
  <g>
    <path d="M180 380 L400 220 L620 380 Z" fill="#A44A22"/>
    <rect x="220" y="380" width="360" height="260" fill="#FDFBF7" stroke="#2A2620" stroke-width="6"/>
    <rect x="260" y="440" width="90" height="90" fill="#F3C2A4" stroke="#2A2620" stroke-width="5"/>
    <rect x="450" y="440" width="90" height="90" fill="#F3C2A4" stroke="#2A2620" stroke-width="5"/>
    <rect x="368" y="500" width="64" height="140" fill="#7E381B"/>
    <circle cx="412" cy="570" r="5" fill="#FDFBF7"/>
  </g>

  <!-- llave inglesa -->
  <g transform="translate(120,260) rotate(-20)">
    <rect x="0" y="30" width="120" height="22" rx="11" fill="#2A2620"/>
    <path d="M112 16 a 24 24 0 1 1 -0.1 34 l 16 -17 z" fill="#2A2620"/>
  </g>

  <!-- rayo eléctrico -->
  <path d="M600 250 L555 340 L590 340 L545 430 L640 320 L600 320 Z" fill="#C55F2C"/>

  <!-- rodillo de pintura -->
  <g transform="translate(560,540) rotate(20)">
    <rect x="0" y="0" width="40" height="90" rx="10" fill="#DD7C47"/>
    <rect x="-8" y="90" width="56" height="12" rx="6" fill="#2A2620"/>
    <rect x="12" y="100" width="16" height="90" rx="8" fill="#2A2620"/>
  </g>

  <!-- badge de confianza -->
  <circle cx="200" cy="600" r="64" fill="#1B1814"/>
  <path d="M170 602 L192 624 L232 580" fill="none" stroke="#FDFBF7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1814">Verificados</text>
</svg>
