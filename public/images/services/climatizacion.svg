<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de un trabajo de aire acondicionado y calefacción">
  <defs>
    <linearGradient id="bgAC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF5EC"/>
      <stop offset="1" stop-color="#F3C2A4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgAC)"/>
  <circle cx="650" cy="470" r="150" fill="#FFFFFF" opacity="0.2"/>

  <!-- pared -->
  <rect x="0" y="0" width="800" height="260" fill="#FDFBF7" opacity="0.5"/>

  <!-- unidad de aire acondicionado -->
  <rect x="220" y="120" width="360" height="100" rx="20" fill="#FDFBF7" stroke="#2A2620" stroke-width="6"/>
  <rect x="250" y="150" width="300" height="14" rx="7" fill="#E7E5E2"/>
  <rect x="250" y="176" width="300" height="14" rx="7" fill="#E7E5E2"/>
  <circle cx="540" cy="140" r="8" fill="#C55F2C"/>

  <!-- copo de nieve -->
  <g stroke="#2A2620" stroke-width="8" stroke-linecap="round" transform="translate(400,360)">
    <line x1="-90" y1="0" x2="90" y2="0"/>
    <line x1="0" y1="-90" x2="0" y2="90"/>
    <line x1="-64" y1="-64" x2="64" y2="64"/>
    <line x1="-64" y1="64" x2="64" y2="-64"/>
  </g>
  <g fill="#C55F2C">
    <circle cx="400" cy="270" r="10"/>
    <circle cx="400" cy="450" r="10"/>
    <circle cx="310" cy="360" r="10"/>
    <circle cx="490" cy="360" r="10"/>
  </g>

  <rect x="32" y="500" width="420" height="64" rx="16" fill="#FDFBF7" opacity="0.92"/>
  <text x="56" y="540" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1B1814">Aire acondicionado y calefacción</text>
</svg>
