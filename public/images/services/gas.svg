  <path d="M400 40 C 430 90, 380 110, 400 150 C 420 130, 450 150, 430 190 C 470 170, 470 110, 430 80 C 435 100, 415 95, 400 40 Z" fill="#DD7C47"/>
  <path d="M400 90 C 412 115, 392 128, 400 150 C 410 140, 422 148, 414 165 C 432 155, 432 128, 414 112 Z" fill="#FDFBF7" opacity="0.85"/>

  <rect x="32" y="500" width="220" height="64" rx="16" fill="#FDFBF7" opacity="0.92"/>
  <text x="56" y="540" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1814">Gas</text>
