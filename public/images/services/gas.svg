      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#E89F72"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgG)"/>
  <circle cx="120" cy="110" r="140" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="700" cy="500" r="150" fill="#5A2814" opacity="0.1"/>

  <!-- caldera -->
  <rect x="300" y="150" width="200" height="320" rx="16" fill="#FDFBF7" stroke="#2A2620" stroke-width="6"/>
  <circle cx="400" cy="230" r="46" fill="#E7E5E2" stroke="#443F38" stroke-width="4"/>
  <circle cx="400" cy="230" r="8" fill="#C55F2C"/>
