<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de un trabajo de pintura">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF5EC"/>
      <stop offset="1" stop-color="#F3C2A4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgP)"/>
  <circle cx="120" cy="480" r="150" fill="#FFFFFF" opacity="0.25"/>

  <!-- pared con franja pintada -->
  <rect x="0" y="0" width="800" height="600" fill="#FDFBF7" opacity="0.4"/>
  <rect x="0" y="0" width="470" height="600" fill="#DD7C47" opacity="0.55"/>
  <rect x="450" y="0" width="30" height="600" fill="#FDFBF7"/>

  <!-- rodillo -->
  <g transform="translate(300,120) rotate(35)">
    <rect x="0" y="0" width="60" height="130" rx="14" fill="#5A2814"/>
    <rect x="-10" y="130" width="80" height="16" rx="8" fill="#2A2620"/>
    <rect x="18" y="146" width="24" height="140" rx="10" fill="#2A2620"/>
  </g>

  <!-- bote de pintura -->
  <g transform="translate(500,340)">
    <rect x="0" y="20" width="120" height="120" rx="10" fill="#FDFBF7" stroke="#2A2620" stroke-width="5"/>
    <rect x="0" y="20" width="120" height="26" fill="#C55F2C"/>
    <rect x="46" y="0" width="28" height="26" rx="6" fill="#2A2620"/>
    <circle cx="60" cy="95" r="26" fill="#DD7C47"/>
  </g>

  <!-- gotas -->
  <circle cx="560" cy="500" r="10" fill="#DD7C47"/>
  <circle cx="600" cy="520" r="7" fill="#DD7C47"/>

  <rect x="32" y="500" width="200" height="64" rx="16" fill="#FDFBF7" opacity="0.92"/>
  <text x="56" y="540" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1814">Pintura</text>
</svg>
