<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustración de un trabajo de carpintería">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3EE"/>
      <stop offset="1" stop-color="#F3E9D8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgC)"/>
  <circle cx="700" cy="90" r="140" fill="#A44A22" opacity="0.1"/>
  <circle cx="70" cy="520" r="120" fill="#5A2814" opacity="0.1"/>

  <!-- tablones de madera -->
  <g>
    <rect x="150" y="330" width="500" height="46" rx="8" fill="#DD7C47" stroke="#7E381B" stroke-width="3"/>
    <rect x="150" y="384" width="500" height="46" rx="8" fill="#E89F72" stroke="#7E381B" stroke-width="3"/>
    <rect x="150" y="438" width="500" height="46" rx="8" fill="#DD7C47" stroke="#7E381B" stroke-width="3"/>
  </g>
  <g stroke="#7E381B" stroke-width="2" opacity="0.5">
    <line x1="200" y1="330" x2="200" y2="376"/>
    <line x1="420" y1="384" x2="420" y2="430"/>
    <line x1="560" y1="438" x2="560" y2="484"/>
  </g>

  <!-- serrucho -->
  <g transform="translate(260,120) rotate(-20)">
    <path d="M0 60 L220 20 L226 44 L0 84 Z" fill="#E7E5E2" stroke="#443F38" stroke-width="4"/>
    <path d="M0 84 L20 84 L4 130 Z" fill="#5A2814"/>
    <g stroke="#443F38" stroke-width="3">
      <line x1="20" y1="70" x2="24" y2="82"/>
      <line x1="60" y1="62" x2="64" y2="74"/>
      <line x1="100" y1="54" x2="104" y2="66"/>
      <line x1="140" y1="46" x2="144" y2="58"/>
      <line x1="180" y1="38" x2="184" y2="50"/>
    </g>
  </g>

  <!-- tornillo -->
  <circle cx="560" cy="180" r="26" fill="#2A2620"/>
  <rect x="552" y="172" width="16" height="16" fill="#FDFBF7"/>

  <rect x="32" y="500" width="240" height="64" rx="16" fill="#FDFBF7" opacity="0.92"/>
  <text x="56" y="540" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1814">Carpintería</text>
</svg>
